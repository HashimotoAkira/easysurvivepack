plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

apply plugin: project.minecraft_version.startsWith('1.')
		? 'net.fabricmc.fabric-loom-remap'
		: 'net.fabricmc.fabric-loom'

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"easy_survival_pack" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.main.java.setSrcDirs(["src/main/version/${project.minecraft_version}/java"])
sourceSets.main.resources.setSrcDirs(["src/main/version/${project.minecraft_version}/resources"])

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (project.minecraft_version.startsWith('1.')) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.minecraft_version.startsWith('1.') ? 21 : 25
}

java {
	withSourcesJar()
	def javaVersion = project.minecraft_version.startsWith('1.') ? 21 : 25
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

base {
	archivesName = 'easy-survival-pack-fabric'
}

def distributionDirectory = layout.projectDirectory.dir('dist')
def distributionFilename = "EasySurvivalPack-${project.version}+mc${project.minecraft_version}.jar"

tasks.register('cleanDist', Delete) {
	group = 'build'
	description = 'Removes older Easy Survival Pack JARs from the distribution directory.'
	delete fileTree(distributionDirectory).matching {
		include 'EasySurvivalPack-*.jar'
	}
}

tasks.register('dist', Copy) {
	group = 'build'
	description = 'Copies the mod jar to the project dist directory.'
	dependsOn tasks.named('jar')
	dependsOn tasks.named('cleanDist')
	from(tasks.named('jar', Jar).flatMap { it.archiveFile })
	into(distributionDirectory)
	rename { distributionFilename }
}

tasks.named('build') {
	dependsOn tasks.named('dist')
}
