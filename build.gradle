plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

apply plugin: project.minecraft_version.startsWith('1.')
		? 'net.fabricmc.fabric-loom-remap'
		: 'net.fabricmc.fabric-loom'

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		url = 'https://maven.ladysnake.org/releases/'
	}
}

loom {
	splitEnvironmentSourceSets()

	if (project.minecraft_version.startsWith('1.')) {
		mixin {
			useLegacyMixinAp = true
			defaultRefmapName = 'easy_survival_pack.refmap.json'
			add sourceSets.main
			add sourceSets.client, 'easy_survival_pack.client.refmap.json'
		}
	}

	mods {
		"easy_survival_pack" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.main.java.setSrcDirs(["src/main/version/${project.minecraft_version}/java"])
sourceSets.client.java.setSrcDirs(["src/client/version/${project.minecraft_version}/java"])
sourceSets.main.resources.setSrcDirs(["src/main/version/${project.minecraft_version}/resources"])
sourceSets.client.resources.setSrcDirs(["src/client/version/${project.minecraft_version}/resources"])

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (project.minecraft_version.startsWith('1.')) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		if (project.minecraft_version == '1.21.1') {
			modCompileOnly "maven.modrinth:trinkets:3.10.0"
			modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"
			modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0"
		}
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.minecraft_version.startsWith('1.') ? 21 : 25
}

java {
	withSourcesJar()
	def javaVersion = project.minecraft_version.startsWith('1.') ? 21 : 25
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

base {
	archivesName = 'easy-survival-pack-fabric'
}

def distributionDirectory = layout.projectDirectory.dir('dist')
def distributionFilename = "EasySurvivalPack-${project.version}+mc${project.minecraft_version}.jar"
def distributionJarTask = tasks.named(project.minecraft_version.startsWith('1.') ? 'remapJar' : 'jar')

tasks.register('dist', Sync) {
	group = 'build'
	description = 'Stages the runtime mod jar and removes outdated code-version jars for the selected Minecraft version.'
	dependsOn distributionJarTask
	from(distributionJarTask)
	into(distributionDirectory)
	preserve {
		include '**/*'
		exclude "EasySurvivalPack-*+mc${project.minecraft_version}.jar"
	}
	rename { distributionFilename }
}

tasks.named('build') {
	dependsOn tasks.named('dist')
}
